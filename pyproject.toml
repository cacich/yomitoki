[project]
name = "yomitoki"
version = "0.0.1"
description = "Personal, multilingual manga screenshot translation reader (OCR, translation, typesetting)."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pillow>=10.0",
    "resvg-py>=0.5",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
